<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:        #0A0A0F;
  --bg-elev:   #131319;
  --bg-elev-2: #1B1B24;
  --text:      #F3F3F6;
  --text-mute: #93939F;
  --border:    rgba(255,255,255,0.08);
  --nav-bg:    rgba(10,10,15,.75);
  --accent:    #FF8A3D;
  --accent-2:  #45D6C6;
  --accent-3:  #7A8CFF;

  --disp: 'Sora', sans-serif;
  --body: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r: 18px;
}
[data-theme="light"]{
  --bg:        #FFFFFF;
  --bg-elev:   #F5F6FA;
  --bg-elev-2: #EAECF3;
  --text:      #14141B;
  --text-mute: #5B5F6E;
  --border:    rgba(15,15,25,0.10);
  --nav-bg:    rgba(255,255,255,.78);
}
[data-theme="light"] ::selection{ color:#fff; }

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background:var(--bg); color:var(--text); font-family:var(--body); line-height:1.65; overflow-x:hidden; transition:background-color .35s ease, color .35s ease; }
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--accent); color:#0A0A0F; }
h1,h2,h3{ font-family:var(--disp); font-weight:700; letter-spacing:-0.02em; }
.container{ max-width:1280px; margin:0 auto; padding:0 24px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}
.reveal{ opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease; }
.reveal.in{ opacity:1; transform:translateY(0); }

/* ===================== NAV ===================== */
.nav{ position:fixed; top:0; left:0; right:0; z-index:400; background:var(--nav-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
.nav-inner{ max-width:1280px; margin:0 auto; padding:0 24px; height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.back-link{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:.92rem; color:var(--text); }
.back-link i{ color:var(--accent); }
.nav-right{ display:flex; align-items:center; gap:10px; }
.lang-pill{ display:flex; background:var(--bg-elev); border-radius:999px; padding:3px; border:1px solid var(--border); }
.lang-pill button{ border:none; background:none; font-family:var(--mono); font-size:.72rem; font-weight:600; padding:7px 13px; border-radius:999px; cursor:pointer; color:var(--text-mute); }
.lang-pill button.active{ background:var(--accent); color:#0A0A0F; }
.theme-toggle{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--bg-elev);
  color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.9rem;
  transition:background .2s ease, border-color .2s ease;
}
.theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }
.theme-toggle .icon-moon{ display:none; }
[data-theme="light"] .theme-toggle .icon-sun{ display:none; }
[data-theme="light"] .theme-toggle .icon-moon{ display:inline; }

/* ===================== HEADER ===================== */
.gallery-header{ padding:150px 0 60px; text-align:center; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }
.eyebrow::before{ content:''; width:20px; height:1px; background:var(--accent); }
.gallery-title{ font-size:clamp(2.1rem,5vw,3.2rem); margin-bottom:16px; }
.gallery-subtitle{ color:var(--text-mute); font-size:1.08rem; max-width:640px; margin:0 auto; }

/* ===================== FILTERS ===================== */
.filters{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:52px; }
.filter-btn{
  font-family:var(--mono); font-size:.8rem; padding:9px 18px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg-elev); color:var(--text-mute); cursor:pointer; transition:all .2s ease;
}
.filter-btn.active{ background:var(--accent); color:#0A0A0F; border-color:var(--accent); }
.filter-btn:hover:not(.active){ border-color:var(--accent); color:var(--text); }

/* ===================== GRID ===================== */
.map-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; padding-bottom:40px; }
.map-card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; opacity:0; transform:translateY(20px); transition:transform .5s ease, opacity .5s ease, border-color .25s ease;
}
.map-card.visible{ opacity:1; transform:translateY(0); }
.map-card:hover{ border-color:var(--accent); transform:translateY(-5px); }
.map-cover{ position:relative; height:220px; overflow:hidden; background:linear-gradient(135deg,var(--bg-elev-2),var(--bg-elev)); }
.map-cover img{ width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
.map-card:hover .map-cover img{ transform:scale(1.08); }
.map-overlay{
  position:absolute; inset:0; background:linear-gradient(to top, rgba(10,10,15,.92) 0%, rgba(10,10,15,.25) 55%, transparent 100%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:18px; opacity:0; transition:opacity .3s ease;
}
.map-card:hover .map-overlay{ opacity:1; }
.map-cat-pill{ align-self:flex-start; font-family:var(--mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; background:rgba(255,138,61,.18); color:var(--accent); border:1px solid rgba(255,138,61,.35); padding:4px 10px; border-radius:999px; margin-bottom:8px; }
.map-overlay-title{ color:#fff; font-family:var(--disp); font-weight:700; font-size:1.02rem; margin-bottom:4px; }
.map-overlay-desc{ color:rgba(255,255,255,.75); font-size:.82rem; line-height:1.4; }
.map-body{ padding:18px 20px 22px; }
.map-body h3{ font-size:1rem; margin-bottom:10px; line-height:1.3; }
.map-meta{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
.map-meta span{ font-size:.8rem; color:var(--text-mute); display:flex; align-items:center; gap:5px; }
.map-tags{ display:flex; flex-wrap:wrap; gap:6px; }
.map-tags span{ font-family:var(--mono); font-size:.66rem; color:var(--text-mute); border:1px solid var(--border); padding:4px 9px; border-radius:6px; }
@media (max-width:980px){ .map-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:620px){ .map-grid{ grid-template-columns:1fr; } }

/* ===================== COUNTER / PAGINATION ===================== */
.counter{ text-align:center; color:var(--text-mute); font-size:.92rem; margin-bottom:28px; }
.counter strong{ color:var(--text); }
.pagination{ display:flex; justify-content:center; align-items:center; gap:16px; padding-bottom:110px; }
.page-btn{
  font-family:var(--mono); font-size:.82rem; padding:10px 20px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg-elev); color:var(--text); cursor:pointer; transition:all .2s ease;
}
.page-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
.page-btn:disabled{ opacity:.35; cursor:not-allowed; }
.page-info{ font-family:var(--mono); font-size:.82rem; color:var(--text-mute); min-width:70px; text-align:center; }

/* ===================== MODAL ===================== */
.modal{ display:none; position:fixed; inset:0; background:rgba(5,5,8,.92); z-index:1000; backdrop-filter:blur(16px); align-items:center; justify-content:center; padding:24px; opacity:0; transition:opacity .3s ease; }
.modal.active{ display:flex; opacity:1; }
body.modal-open{ overflow:hidden; }
.modal-content{
  position:relative; max-width:900px; width:100%; max-height:90vh; overflow-y:auto;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:20px;
  transform:scale(.94); transition:transform .3s ease; display:flex; flex-direction:column;
}
.modal.active .modal-content{ transform:scale(1); }
.modal-close{
  position:absolute; top:16px; right:16px; width:42px; height:42px; border-radius:50%; border:none;
  background:rgba(10,10,15,.6); color:#fff; font-size:1.3rem; cursor:pointer; z-index:5;
  display:flex; align-items:center; justify-content:center; transition:all .2s ease;
}
.modal-close:hover{ background:var(--accent); color:#0A0A0F; transform:rotate(90deg); }
.modal-image{ width:100%; max-height:52vh; object-fit:contain; background:var(--bg); }
.modal-info{ padding:32px; }
.modal-title{ font-size:1.6rem; margin-bottom:12px; }
.modal-description{ color:var(--text-mute); font-size:1.02rem; margin-bottom:24px; }
.modal-details{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; background:var(--bg-elev-2); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; }
.detail-item{ text-align:center; }
.detail-label{ font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); margin-bottom:6px; }
.detail-value{ font-family:var(--disp); font-weight:700; font-size:.95rem; }
.modal-tags{ display:flex; flex-wrap:wrap; gap:8px; }
.modal-tags span{ font-family:var(--mono); font-size:.72rem; color:var(--text-mute); border:1px solid var(--border); padding:5px 11px; border-radius:8px; }
@media (max-width:700px){ .modal-info{ padding:22px; } .modal-title{ font-size:1.3rem; } }

@media (max-width:480px){
  .gallery-header{ padding:120px 0 40px; }
  .nav-inner{ padding:0 16px; }
  .container{ padding:0 18px; }
}
</style>
</head>

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('jtg-theme', next);
});

// ================= LANGUAGE TOGGLE =================
let currentLang = localStorage.getItem('jtg-lang') || 'fr';
const langBtns = document.querySelectorAll('.lang-pill button');
function applyStaticLang(){
  langBtns.forEach(b=> b.classList.toggle('active', b.dataset.lang === currentLang));
  document.querySelectorAll('[data-fr]').forEach(el=>{
    const val = el.dataset[currentLang];
    if(val !== undefined) el.textContent = val;
  });
  document.documentElement.lang = currentLang;
}
langBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentLang = btn.dataset.lang;
    localStorage.setItem('jtg-lang', currentLang);
    applyStaticLang();
    renderPage();
  });
});

// ================= STATE =================
const PER_PAGE = 6;
let currentFilter = 'all';
let currentPage = 1;

const grid = document.getElementById('mapGrid');
const counterEl = document.getElementById('counter');
const curPageEl = document.getElementById('curPage');
const totPagesEl = document.getElementById('totPages');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function getFiltered(){
  return currentFilter === 'all' ? maps : maps.filter(m => m.cats.includes(currentFilter));
}

function cardHTML(m){
  const tagsHTML = m.tags.map(t=>`<span>${t[currentLang]}</span>`).join('');
  return `
    <div class="map-card">
      <div class="map-cover">
        <img src="${m.img}" alt="${m.title[currentLang]}" loading="lazy">
        <div class="map-overlay">
          <span class="map-cat-pill">${m.catLabel[currentLang]}</span>
          <div class="map-overlay-title">${m.title[currentLang]}</div>
          <div class="map-overlay-desc">${m.desc[currentLang]}</div>
        </div>
      </div>
      <div class="map-body">
        <h3>${m.title[currentLang]}</h3>
        <div class="map-meta">
          <span>📅 ${m.year}</span>
          <span>📍 ${m.loc[currentLang]}</span>
          <span>🎯 ${m.scale}</span>
        </div>
        <div class="map-tags">${tagsHTML}</div>
      </div>
    </div>`;
}

function renderPage(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  grid.innerHTML = pageItems.map(cardHTML).join('');

  // wire click -> modal
  Array.from(grid.children).forEach((el, i)=>{
    el.addEventListener('click', ()=> openModal(pageItems[i]));
    requestAnimationFrame(()=> setTimeout(()=> el.classList.add('visible'), i * 60));
  });

  const visibleLabel = currentLang === 'fr' ? 'cartes visibles sur' : 'maps visible out of';
  counterEl.innerHTML = `<strong>${pageItems.length}</strong> ${visibleLabel} <strong>${filtered.length}</strong>`;
  curPageEl.textContent = currentPage;
  totPagesEl.textContent = totalPages;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
}

document.getElementById('filters').addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  currentPage = 1;
  renderPage();
});

prevBtn.addEventListener('click', ()=>{ if(currentPage>1){ currentPage--; renderPage(); } });
nextBtn.addEventListener('click', ()=>{
  const totalPages = Math.max(1, Math.ceil(getFiltered().length / PER_PAGE));
  if(currentPage < totalPages){ currentPage++; renderPage(); }
});

// ================= MODAL =================
const modal = document.getElementById('modal');
const modalImage = document.getElementById('modalImage');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalYear = document.getElementById('modalYear');
const modalLoc = document.getElementById('modalLoc');
const modalScale = document.getElementById('modalScale');
const modalCat = document.getElementById('modalCat');
const modalTags = document.getElementById('modalTags');
let scrollPos = 0;

function openModal(m){
  scrollPos = window.pageYOffset || document.documentElement.scrollTop;
  modalImage.src = m.img;
  modalImage.alt = m.title[currentLang];
  modalTitle.textContent = m.title[currentLang];
  modalDesc.textContent = m.desc[currentLang];
  modalYear.textContent = m.year;
  modalLoc.textContent = m.loc[currentLang];
  modalScale.textContent = m.scale;
  modalCat.textContent = m.catLabel[currentLang];
  modalTags.innerHTML = m.tags.map(t=>`<span>${t[currentLang]}</span>`).join('');
  modal.style.display = 'flex';
  document.body.classList.add('modal-open');
  requestAnimationFrame(()=> modal.classList.add('active'));
}
function closeModal(){
  modal.classList.remove('active');
  setTimeout(()=>{
    modal.style.display = 'none';
    document.body.classList.remove('modal-open');
    window.scrollTo(0, scrollPos);
  }, 300);
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });

// ================= INIT =================
applyStaticLang();
renderPage();

// reveal on load for header/filters
document.querySelectorAll('.reveal').forEach(el=> el.classList.add('in'));
</script>
